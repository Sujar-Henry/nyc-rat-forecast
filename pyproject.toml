[project]
name = "ratcast"
version = "0.1.0"
description = "Predicting where NYC rodent inspectors will find rat activity, using public inspection records and XGBoost."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "h3>=4.1",
    "matplotlib>=3.9",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ratcast = "ratcast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
